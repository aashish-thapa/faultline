# Derived from AutoMQ 1.7.5 docker/docker-compose-cluster.yaml.
# Changes: static IPs (so faults can target peers) and an EXTERNAL listener
# published on 127.0.0.1:19091-19093 so the harness can run on the host.
x-common-variables: &common-env
  KAFKA_S3_ACCESS_KEY: minioadmin
  KAFKA_S3_SECRET_KEY: minioadmin
  KAFKA_HEAP_OPTS: -Xms1g -Xmx2g -XX:MetaspaceSize=96m -XX:MaxDirectMemorySize=1G
  CLUSTER_ID: 5XF4fHIOTfSIqkmje2KFlg

services:
  minio:
    container_name: minio
    image: pgsty/silo:RELEASE.2026-09-03T13-18-01Z
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_DOMAIN: minio
    command: [ "server", "/data", "--console-address", ":9001" ]
    networks:
      automq_net:
        ipv4_address: 10.6.0.5
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://minio:9000/minio/health/live" ]
      interval: 5s
      timeout: 5s
      retries: 3

  mc:
    container_name: mc
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set minio http://minio:9000 minioadmin minioadmin) do echo '...waiting...' && sleep 1; done;
      /usr/bin/mc mb --ignore-existing minio/automq-data;
      /usr/bin/mc mb --ignore-existing minio/automq-ops;
      tail -f /dev/null
      "
    networks:
      - automq_net

  server1:
    container_name: automq-server1
    image: automqinc/automq:1.7.5
    stop_grace_period: 1m
    environment:
      <<: *common-env
    command:
      - bash
      - -c
      - |
        /opt/automq/kafka/bin/kafka-server-start.sh \
        /opt/automq/kafka/config/kraft/server.properties \
        --override cluster.id=$$CLUSTER_ID \
        --override node.id=0 \
        --override controller.quorum.voters=0@server1:9093,1@server2:9093,2@server3:9093 \
        --override controller.quorum.bootstrap.servers=server1:9093,server2:9093,server3:9093 \
        --override listeners=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094 \
        --override listener.security.protocol.map=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT \
        --override advertised.listeners=PLAINTEXT://server1:9092,EXTERNAL://127.0.0.1:19091 \
        --override s3.data.buckets='0@s3://automq-data?region=us-east-1&endpoint=http://minio:9000&pathStyle=true' \
        --override s3.ops.buckets='1@s3://automq-ops?region=us-east-1&endpoint=http://minio:9000&pathStyle=true' \
        --override s3.wal.path='0@s3://automq-data?region=us-east-1&endpoint=http://minio:9000&pathStyle=true'
    ports:
      - "19091:9094"
    networks:
      automq_net:
        ipv4_address: 10.6.0.11
    depends_on:
      mc:
        condition: service_started

  server2:
    container_name: automq-server2
    image: automqinc/automq:1.7.5
    stop_grace_period: 1m
    environment:
      <<: *common-env
    command:
      - bash
      - -c
      - |
        /opt/automq/kafka/bin/kafka-server-start.sh \
        /opt/automq/kafka/config/kraft/server.properties \
        --override cluster.id=$$CLUSTER_ID \
        --override node.id=1 \
        --override controller.quorum.voters=0@server1:9093,1@server2:9093,2@server3:9093 \
        --override controller.quorum.bootstrap.servers=server1:9093,server2:9093,server3:9093 \
        --override listeners=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094 \
        --override listener.security.protocol.map=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT \
        --override advertised.listeners=PLAINTEXT://server2:9092,EXTERNAL://127.0.0.1:19092 \
        --override s3.data.buckets='0@s3://automq-data?region=us-east-1&endpoint=http://minio:9000&pathStyle=true' \
        --override s3.ops.buckets='1@s3://automq-ops?region=us-east-1&endpoint=http://minio:9000&pathStyle=true' \
        --override s3.wal.path='0@s3://automq-data?region=us-east-1&endpoint=http://minio:9000&pathStyle=true'
    ports:
      - "19092:9094"
    networks:
      automq_net:
        ipv4_address: 10.6.0.12
    depends_on:
      mc:
        condition: service_started

  server3:
    container_name: automq-server3
    image: automqinc/automq:1.7.5
    stop_grace_period: 1m
    environment:
      <<: *common-env
    command:
      - bash
      - -c
      - |
        /opt/automq/kafka/bin/kafka-server-start.sh \
        /opt/automq/kafka/config/kraft/server.properties \
        --override cluster.id=$$CLUSTER_ID \
        --override node.id=2 \
        --override controller.quorum.voters=0@server1:9093,1@server2:9093,2@server3:9093 \
        --override controller.quorum.bootstrap.servers=server1:9093,server2:9093,server3:9093 \
        --override listeners=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094 \
        --override listener.security.protocol.map=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT \
        --override advertised.listeners=PLAINTEXT://server3:9092,EXTERNAL://127.0.0.1:19093 \
        --override s3.data.buckets='0@s3://automq-data?region=us-east-1&endpoint=http://minio:9000&pathStyle=true' \
        --override s3.ops.buckets='1@s3://automq-ops?region=us-east-1&endpoint=http://minio:9000&pathStyle=true' \
        --override s3.wal.path='0@s3://automq-data?region=us-east-1&endpoint=http://minio:9000&pathStyle=true'
    ports:
      - "19093:9094"
    networks:
      automq_net:
        ipv4_address: 10.6.0.13
    depends_on:
      mc:
        condition: service_started

networks:
  automq_net:
    name: automq_net
    driver: bridge
    ipam:
      config:
        - subnet: 10.6.0.0/16
